name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, chore/api-performance-prework ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x
      - name: Fetch dotnet-diagnostics packages
        # dotnet-diagnostics-benchmarkdotnet / dotnet-diagnostics-core are not published to any
        # NuGet feed (nuget.org or GitHub Packages) — only attached as .nupkg assets on GitHub
        # Releases of pedrosakuma/dotnet-diagnostics. nuget.config points a local folder source
        # at local-packages/, which is gitignored, so CI must download the assets itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p local-packages
          gh release download v0.24.0 -R pedrosakuma/dotnet-diagnostics \
            -p "dotnet-diagnostics-benchmarkdotnet.0.24.0.nupkg" \
            -p "dotnet-diagnostics-core.0.24.0.nupkg" \
            -D local-packages --clobber
      - name: Restore
        run: dotnet restore FixSourceGenerator.sln
      - name: Build
        run: dotnet build FixSourceGenerator.sln --no-restore -c Release
      - name: Test
        run: dotnet test FixSourceGenerator.sln --no-build -c Release
      - name: Run migration example
        run: |
          dotnet run --no-build -c Release -f net6.0 --project examples/ScopedCodec
          dotnet run --no-build -c Release -f net9.0 --project examples/ScopedCodec
      - name: Temporal reader runtime compatibility
        run: |
          for framework in net6.0 net8.0 net9.0 net10.0; do
            dotnet test tests/FixSourceGenerator.Tests/FixSourceGenerator.Tests.csproj \
              -c Release -p:TemporalRuntimeTargetFramework="$framework" \
              --filter FullyQualifiedName~TemporalReaderTests
          done
      - name: Check investigation fixtures and local runner
        run: |
          dotnet test benchmarks/experiments/eager-projection/tests/EagerProjection.Tests.csproj -c Release
          bash -n scripts/agents/local.sh
          scripts/agents/local.sh --help
          dotnet run --no-build -c Release --project benchmarks/FixSourceGenerator.Benchmarks -- --reader-order-check
          dotnet run --no-build -c Release --project benchmarks/FixSourceGenerator.Benchmarks -- --reader-process-check
          dotnet run --no-build -c Release --project benchmarks/FixSourceGenerator.Benchmarks -- --writer-pipeline-check
          dotnet run --no-build -c Release --project benchmarks/FixSourceGenerator.Benchmarks -- --reader-fixview-check
          dotnet run --no-build -c Release --project benchmarks/FixSourceGenerator.Benchmarks -- --combined-check
          dotnet run --no-build -c Release --project benchmarks/FixSourceGenerator.Benchmarks -- --design-check
